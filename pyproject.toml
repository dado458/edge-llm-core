[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-llm-core"
version = "0.1.0"
description = "Framework for building autonomous Edge LLM agents as MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["mcp", "llm", "agent", "anthropic", "edge-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
redis   = ["redis>=5.0.0"]
pg      = ["psycopg2-binary>=2.9.0"]
server  = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]
all     = ["edge-llm-core[redis,pg,server]"]
dev     = ["pytest>=8.0", "pytest-asyncio", "build", "twine"]

[project.urls]
Homepage   = "https://github.com/dado458/edge-llm-core"
Repository = "https://github.com/dado458/edge-llm-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
